name: Packaging & install

on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - "src/**"
      - "packaging/**"
      - "evals/harness/install_test.sh"
      - "pyproject.toml"
      - ".github/workflows/packaging.yml"
  pull_request:
  workflow_dispatch:

jobs:
  artifacts:
    name: build wheel · sdist · deb (+ clean-venv smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build

      - name: Build .deb
        run: packaging/deb/build-deb.sh dist/jarvis_agent-*.whl dist

      - name: Smoke-test wheel in a clean venv (no index, no repo)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet --no-index dist/jarvis_agent-*.whl
          /tmp/clean/bin/jarvis --version
          JARVIS_STATE_DIR=/tmp/state /tmp/clean/bin/jarvis --json explain "what is the kernel type" | grep -q kernel.ostype

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-artifacts
          path: dist/*

  install-test:
    name: install on ${{ matrix.name }} (native artifact)
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: "debian:12", name: "debian-12" }
          - { distro: "ubuntu:24.04", name: "ubuntu-24.04" }
          - { distro: "fedora:latest", name: "fedora" }
          - { distro: "archlinux:latest", name: "arch" }
          - { distro: "alpine:latest", name: "alpine" }
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: jarvis-artifacts
          path: dist

      - name: Install + smoke on ${{ matrix.distro }}
        run: |
          docker run --rm \
            -v "$PWD":/repo -w /repo \
            -e JARVIS_STATE_DIR=/tmp/jarvis-install-state \
            -e GITHUB_ACTIONS=true -e CI=true \
            ${{ matrix.distro }} \
            sh evals/harness/install_test.sh "${{ matrix.name }}"
