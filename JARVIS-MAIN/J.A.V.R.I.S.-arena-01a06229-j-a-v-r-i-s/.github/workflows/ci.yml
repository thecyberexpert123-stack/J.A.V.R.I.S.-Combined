name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (editable) with dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (static types)
        run: mypy src/jarvis

      - name: Tests (failures annotated)
        env:
          # The live KB tests verify citations via api.github.com; the runner
          # token lifts the per-IP unauthenticated rate limit (fetch.py never
          # logs it). Prevents the documented 403/429 flake class.
          GITHUB_TOKEN: ${{ github.token }}
        run: python evals/harness/unit_gate.py

      - name: Planner eval (M2, scripted LLM)
        run: python evals/harness/m2_eval.py --catalog evals/catalog/m2.json --results evals/results/m2-ci.json

      - name: Fault-injection gate (M3)
        run: python evals/harness/m3_faults.py --results evals/results/m3-faults-ci.json

      - name: Grounding eval (M4, incl. torvalds/linux upstream verification)
        env:
          JARVIS_ONLINE_DOCS: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: python evals/harness/m4_grounding.py --catalog evals/catalog/m4.json --results evals/results/m4-grounding-ci.json

  gui-eval:
    name: GUI eval on real X (M5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_ACTIONS: true
    steps:
      - uses: actions/checkout@v4

      - name: Install X stack (Xvfb + i3 + tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb i3-wm xterm xdotool wmctrl scrot
          sudo apt-get install -y --no-install-recommends at-spi2-core python3-pyatspi || echo "AT-SPI optional packages unavailable"

      - name: Headless honesty subset (refusals without a display)
        run: python3 evals/harness/m5_gui.py --catalog evals/catalog/m5.json --results evals/results/m5-gui-headless-ci.json --headless

      - name: 15-task GUI suite on Xvfb + i3
        run: python3 evals/harness/m5_gui.py --catalog evals/catalog/m5.json --results evals/results/m5-gui-ci.json --xvfb
