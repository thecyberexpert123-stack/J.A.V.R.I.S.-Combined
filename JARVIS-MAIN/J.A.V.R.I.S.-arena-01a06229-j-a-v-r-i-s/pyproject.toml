[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name avoids the (near-certain) PyPI collision of bare "jarvis";
# the importable Python package is `jarvis` (see ADR-0004).
name = "jarvis-agent"
version = "1.20.0"
description = "JARVIS (Just A Rather Very Intelligent System) - a verified, safety-kernelled automation agent for Linux."
readme = "README.md"
requires-python = ">=3.10"
# NOTE: license field intentionally omitted - license selection is an owner
# decision, pending (PLAN 13.6). No placeholder license text is shipped.
authors = [{ name = "JARVIS project owner" }]
keywords = ["linux", "automation", "agent", "system-administration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

# Runtime dependencies intentionally absent in M0 (ADR-0004).
# They enter at M1+ one by one, each with a justification note (owner guideline 16).
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

[project.scripts]
jarvis = "jarvis.cli.app:main"

[project.urls]
Homepage = "https://github.com/thecyberexpert123-stack/J.A.V.R.I.S."

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis.knowledge" = ["data/*.json"]
"jarvis.intent" = ["model.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
# Strictness is raised per-module as core/safety/execution land (M1+, PLAN 5).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: integration tests that run real commands on the host (enable with RUN_LIVE=1)",
    "live_llm: needs a real local LLM (enable with RUN_LIVE_LLM=1 + reachable Ollama)",
]
